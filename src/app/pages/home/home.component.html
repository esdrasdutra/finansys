<section id="filter-container">
    <div class="search-bar">
        <div class="search-name">
            <div class="input-group">
                <mat-icon aria-hidden="false" aria-label="Filter Icon" fontIcon="filter_alt"></mat-icon>
                <select id="input-group-filter" [(ngModel)]="selectedFiltro" (change)="onFiltroChange($event)">
                    <option value="">Selecione um filtro</option>
                    <option *ngFor="let filtro of filtros" [value]="filtro">{{ filtro }}</option>
                </select>
                <mat-icon aria-hidden="false" aria-label="Search Icon" fontIcon="filter_list"></mat-icon>
                <select id="input-group-filter" [(ngModel)]="selectedMes" (change)="onMesChange($event)">
                    <option value="">Selecione um mês</option>
                    <option *ngFor="let mes of meses" [value]="mes">{{ mes }}</option>
                </select>

                <mat-form-field appearance="outline" class="filter-field">
                    <mat-label>Entrada</mat-label>
                    <mat-select [(ngModel)]="filterEntrada">
                        <mat-option value="">Todas</mat-option>
                        <mat-option *ngFor="let option of inflowsOptions" [value]="option">{{ option }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="filter-field">
                    <mat-label>Saída</mat-label>
                    <mat-select [(ngModel)]="filterSaida">
                        <mat-option value="">Todas</mat-option>
                        <mat-option *ngFor="let option of outflowsOptions" [value]="option">{{ option }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="filter-field">
                    <mat-label>Conta</mat-label>
                    <mat-select [(ngModel)]="filterConta">
                        <mat-option value="">Todas</mat-option>
                        <mat-option *ngFor="let option of accountOptions" [value]="option">{{ option }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <input type="text" (keyup)="onKey($event)" placeholder="Buscar...">
            </div>
        </div>
    </div>
</section>

<section id="tab-container">
    <div class="crud-buttons">
        <app-crud-buttons></app-crud-buttons>
    </div>

    <div class="lancamentos">
        <app-lancamento-list 
            class="position-sticky custom-container"
            [filterEntradaInput]="filterEntrada"
            [filterSaidaInput]="filterSaida"
            [filterContaInput]="filterConta">
        </app-lancamento-list>
    </div>
</section>
