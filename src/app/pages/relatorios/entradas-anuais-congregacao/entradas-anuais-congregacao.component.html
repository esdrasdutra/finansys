<div class="container">
    <h2>Relatório de Entradas Anuais por Congregação</h2>

    <div class="date-selection">
        <mat-form-field appearance="fill">
            <mat-label>Data Inicial</mat-label>
            <input matInput [matDatepicker]="pickerStart" [(ngModel)]="startDate">
            <mat-datepicker-toggle matSuffix [for]="pickerStart"></mat-datepicker-toggle>
            <mat-datepicker #pickerStart></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Data Final</mat-label>
            <input matInput [matDatepicker]="pickerEnd" [(ngModel)]="endDate">
            <mat-datepicker-toggle matSuffix [for]="pickerEnd"></mat-datepicker-toggle>
            <mat-datepicker #pickerEnd></mat-datepicker>
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="onDateChange()">Filtrar</button>
    </div>

    <div class="data-table">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Congregação</th>
                    <th>Total no Período</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngFor="let cong of congregations">
                    <tr *ngIf="annualEntries[cong] > 0">
                        <td>{{ cong }}</td>
                        <td>{{ formatCurrency(annualEntries[cong]) }}</td>
                    </tr>
                </ng-container>
                <tr *ngIf="isAnnualEntriesEmpty()">
                    <td colspan="2" class="text-center">Nenhum dado disponível para o período selecionado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
