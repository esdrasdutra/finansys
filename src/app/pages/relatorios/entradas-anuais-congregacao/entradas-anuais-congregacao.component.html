<div class="container">
    <h2>Relatório de Entradas Anuais por Congregação</h2>

    <div class="year-selection">
        <label for="yearSelect">Selecione o Ano:</label>
        <select id="yearSelect" [(ngModel)]="selectedYear" (change)="onYearChange()">
            <option *ngFor="let year of availableYears" [value]="year">{{ year }}</option>
        </select>
    </div>

    <div class="data-table">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Congregação</th>
                    <th>Total Anual</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngFor="let cong of congregations">
                    <tr *ngIf="annualEntries[cong] > 0">
                        <td>{{ cong }}</td>
                        <td>{{ formatCurrency(annualEntries[cong]) }}</td>
                    </tr>
                </ng-container>
                <tr *ngIf="isAnnualEntriesEmpty()">
                    <td colspan="2" class="text-center">Nenhum dado disponível para o ano selecionado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
